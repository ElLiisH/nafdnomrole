<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - NAFDAC Admin Portal</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-top: 5px solid #004d25;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #00cc66;
      border-radius: 50%;
      margin-right: 6px;
    }

    .header .brand {
      font-weight: 700;
      font-size: 1rem;
      color: #111;
      letter-spacing: 0.5px;
    }

    .header h1 {
      font-size: 1.5rem;
      color: #004d25;
      margin-top: 12px;
      font-weight: 700;
    }

    .header p {
      font-size: 0.875rem;
      color: #666;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-wrapper input {
      width: 100%;
      padding: 12px 45px 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .password-wrapper input:focus {
      border-color: #004d25;
    }

    button.toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: auto !important;
      height: auto !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    button.toggle-password svg {
      stroke: #666;
    }

    .btn-submit {
      width: 100%;
      background-color: #004d25;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #003318;
    }

    .btn-submit:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background-color: #fde8e8;
      color: #9b1c1c;
      border: 1px solid #f8b4b4;
    }

    .alert-success {
      background-color: #def7ec;
      color: #03543f;
      border: 1px solid #84e1bc;
    }

    .back-to-login {
      text-align: center;
      margin-top: 20px;
    }

    .back-to-login a {
      color: #0066cc;
      text-decoration: none;
      font-size: 0.875rem;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div>
        <span class="dot"></span>
        <span class="brand">NAFDAC</span>
      </div>
      <h1>Set New Password</h1>
      <p>Please enter your new password below.</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert"></div>

    <form id="resetPasswordForm">
      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" required placeholder="At least 6 characters" minlength="6">
          <button type="button" id="toggleNewPasswordBtn" class="toggle-password" aria-label="Toggle visibility">
            <svg class="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm New Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" required placeholder="Re-enter your new password">
          <button type="button" id="toggleConfirmPasswordBtn" class="toggle-password" aria-label="Toggle visibility">
            <svg class="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Update Password</button>
    </form>

    <div class="back-to-login">
      <a href="signin.html">← Back to Sign In</a>
    </div>
  </div>

  <script>
    // Connected to your live Supabase credentials
    const SUPABASE_URL = "https://wzwknwosmqgxxzmdhhkm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-A8sW_NQysSl-kN6GD9byA_0q-b96Q1";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('resetPasswordForm');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }

    // Toggle Eye Functionality
    const eyeOpenPath = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    const eyeClosedPath = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

    function setupToggle(buttonId, inputId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      const svg = btn.querySelector('svg');

      btn.addEventListener('click', () => {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        svg.innerHTML = isPassword ? eyeClosedPath : eyeOpenPath;
      });
    }

    setupToggle('toggleNewPasswordBtn', 'newPassword');
    setupToggle('toggleConfirmPasswordBtn', 'confirmPassword');

    // Listen for the recovery event to establish an active auth session from the email URL token
    let isRecoverySessionActive = false;
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || session) {
        isRecoverySessionActive = true;
      }
    });

    // Handle Form Submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match. Please try again.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        // Explicitly update password for the authenticated recovery session
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

        if (error) throw error;

        showAlert('Password updated successfully! Redirecting to sign in...', 'success');
        
        // Sign out temporary recovery session so user starts clean at signin
        await supabaseClient.auth.signOut();

        setTimeout(() => {
          window.location.href = 'signin.html';
        }, 2000);

      } catch (err) {
        console.error('Password reset error:', err.message);
        showAlert(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
