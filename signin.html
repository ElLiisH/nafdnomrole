<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAFDAC Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 5px solid #013220; }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        h2 { color: #013220; text-align: center; margin-bottom: 2rem; }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #334155; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #013220; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0c3f2c; }
        .error { color: #d32f2f; font-size: 0.875rem; margin-top: 1rem; text-align: center; display: none; }
                /* Password Wrapper Styling */
        .password-wrapper {
          position: relative;
          display: flex;
          align-items: center;
        }
        
        .password-wrapper input {
          width: 100%;
          padding-right: 45px; /* Leave space so text doesn't overlap the eye icon */
        }
        
        .toggle-password {
          position: absolute;
          right: 12px;
          background: none;
          border: none;
          cursor: pointer;
          color: #666;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
        }
        
        .toggle-password:hover {
          color: #333;
        }
        
        /* Forgot Password Link */
        .form-actions-extra {
          text-align: right;
          margin-top: 8px;
          margin-bottom: 16px;
        }
        
        .forgot-link {
          font-size: 0.875rem;
          color: #0066cc;
          text-decoration: none;
        }
        
        .forgot-link:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🟢 <strong>NAFDAC</strong></div>
        <h2>Admin Portal</h2>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="admin@nafdac.gov.ng">
        </div>
                <!-- Password Field Group -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" required placeholder="Enter your password">
            <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle password visibility">
              <!-- Eye Icon (SVG) -->
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        
        <!-- Forgot Password Link -->
        <div class="form-actions-extra">
          <a href="#" id="forgotPasswordBtn" class="forgot-link">Forgot Password?</a>
        </div>
        <button onclick="handleLogin()">Sign In</button>
        <div id="error-msg" class="error"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://wzwknwosmqgxxzmdhhkm.supabase.co";
      const SUPABASE_KEY = "sb_publishable_-A8sW_NQysSl-kN6GD9byA_0q-b96Q1";
    
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
      async function handleLogin() {
        const userVal = document.getElementById('email').value.trim();
        const passwordVal = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('error-msg');
    
        errorDiv.style.display = 'none';
    
        if (!userVal || !passwordVal) {
          errorDiv.innerText = "Please enter both email and password.";
          errorDiv.style.display = 'block';
          return;
        }
    
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: userVal,
          password: passwordVal
        });
    
        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.style.display = 'block';
        } else {
          window.location.href = 'index.html';
        }
      }
      const passwordInput = document.getElementById('password');
const togglePasswordBtn = document.getElementById('togglePasswordBtn');
const eyeIcon = document.getElementById('eyeIcon');

// SVG Path for Eye (Open)
const eyeOpenPath = `
  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
  <circle cx="12" cy="12" r="3"></circle>
`;

// SVG Path for Eye Off (Closed/Slashed)
const eyeClosedPath = `
  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
  <line x1="1" y1="1" x2="23" y2="23"></line>
`;

togglePasswordBtn.addEventListener('click', () => {
  const isPassword = passwordInput.getAttribute('type') === 'password';
  
  // Toggle input type
  passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
  
  // Toggle Icon SVG
  eyeIcon.innerHTML = isPassword ? eyeClosedPath : eyeOpenPath;
});
    </script>
</body>
</html>
