<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAFDAC Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 5px solid #013220; }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        h2 { color: #013220; text-align: center; margin-bottom: 2rem; }
        .input-group, .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #334155; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #013220; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0c3f2c; }
        .error { color: #d32f2f; font-size: 0.875rem; margin-top: 1rem; text-align: center; display: none; }
        
        /* Password Wrapper Container */
        .password-wrapper {
          position: relative;
          display: flex;
          align-items: center;
          width: 100%;
        }
        
        .password-wrapper input {
          width: 100%;
          padding-right: 45px; /* Keeps text from typing under the eye */
        }
        
        /* Explicit Override for Toggle Button */
        button.toggle-password {
          position: absolute;
          right: 12px;
          top: 50%;
          transform: translateY(-50%);
          
          /* Overriding global button styles */
          width: auto !important;
          height: auto !important;
          background: transparent !important;
          border: none !important;
          padding: 0 !important;
          margin: 0 !important;
          box-shadow: none !important;
          
          cursor: pointer;
          color: #666;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 2;
        }
        
        button.toggle-password:hover {
          color: #000;
          background: transparent !important;
        }
        
        /* Eye Icon Color inside the field */
        .toggle-password svg {
          stroke: #666;
        }
        
        /* Forgot Password Link */
        .form-actions-extra {
          text-align: right;
          margin-top: 8px;
          margin-bottom: 16px;
        }
        
        .forgot-link {
          font-size: 0.875rem;
          color: #0066cc;
          text-decoration: none;
        }
        
        .forgot-link:hover {
          text-decoration: underline;
        }

        /* Modal Styling */
        .modal-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 1000;
        }
        
        .modal-card {
          background: #fff;
          border-radius: 10px;
          padding: 24px;
          width: 90%;
          max-width: 400px;
          box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .modal-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 12px;
        }
        
        .modal-header h3 {
          font-size: 1.2rem;
          color: #013220;
          margin: 0;
        }
        
        .close-btn {
          background: none !important;
          border: none !important;
          font-size: 1.5rem;
          cursor: pointer;
          color: #666;
          width: auto !important;
          padding: 0 !important;
        }
        
        .modal-desc {
          font-size: 0.875rem;
          color: #555;
          margin-bottom: 16px;
          line-height: 1.4;
        }

        /* Modal Alerts */
        .alert {
          padding: 10px 12px;
          border-radius: 6px;
          font-size: 0.85rem;
          margin-bottom: 14px;
        }
        .alert-success {
          background-color: #def7ec;
          color: #03543f;
          border: 1px solid #84e1bc;
        }
        .alert-error {
          background-color: #fde8e8;
          color: #9b1c1c;
          border: 1px solid #f8b4b4;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🟢 <strong>NAFDAC</strong></div>
        <h2>Admin Portal</h2>
        
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="admin@nafdac.gov.ng">
        </div>
        
        <!-- Password Field Group -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" required placeholder="Enter your password">
            <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle password visibility">
              <!-- Eye Icon (SVG) -->
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        
        <!-- Forgot Password Link -->
        <div class="form-actions-extra">
          <a href="#" id="forgotPasswordBtn" class="forgot-link">Forgot Password?</a>
        </div>
        
        <button onclick="handleLogin()">Sign In</button>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- Forgot Password Modal (Placed BEFORE script tag so DOM finds elements) -->
    <div id="forgotPasswordModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Reset Password</h3>
          <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <p class="modal-desc">Enter your account email address. We'll send you a secure link to reset your password.</p>
        
        <div id="modalAlert" class="alert" style="display: none;"></div>

        <form id="requestResetForm">
          <div class="form-group">
            <label for="resetEmail">Email Address</label>
            <input type="email" id="resetEmail" required placeholder="e.g. name@nafdac.gov.ng">
          </div>
          <button type="submit" id="sendResetBtn">Send Reset Link</button>
        </form>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://wzwknwosmqgxxzmdhhkm.supabase.co";
      const SUPABASE_KEY = "sb_publishable_-A8sW_NQysSl-kN6GD9byA_0q-b96Q1";
    
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
      async function handleLogin() {
        const userVal = document.getElementById('email').value.trim();
        const passwordVal = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('error-msg');
    
        errorDiv.style.display = 'none';
    
        if (!userVal || !passwordVal) {
          errorDiv.innerText = "Please enter both email and password.";
          errorDiv.style.display = 'block';
          return;
        }
    
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: userVal,
          password: passwordVal
        });
    
        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.style.display = 'block';
        } else {
          window.location.href = 'index.html';
        }
      }

      // Password Eye Toggle Logic
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const eyeIcon = document.getElementById('eyeIcon');

      const eyeOpenPath = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;

      const eyeClosedPath = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      `;

      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.innerHTML = isPassword ? eyeClosedPath : eyeOpenPath;
      });

      // Modal Elements
      const forgotModal = document.getElementById('forgotPasswordModal');
      const forgotLink = document.getElementById('forgotPasswordBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const requestResetForm = document.getElementById('requestResetForm');
      const modalAlert = document.getElementById('modalAlert');
      const sendResetBtn = document.getElementById('sendResetBtn');

      // Open / Close Modal
      forgotLink.addEventListener('click', (e) => {
        e.preventDefault();
        forgotModal.style.display = 'flex';
      });

      closeModalBtn.addEventListener('click', () => {
        forgotModal.style.display = 'none';
      });

      // Send Reset Request via Supabase
      requestResetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value.trim();

        sendResetBtn.disabled = true;
        sendResetBtn.textContent = 'Sending...';

        try {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: `${window.location.origin}/reset-password.html`,
          });

          if (error) throw error;

          modalAlert.textContent = `A password reset link has been sent to ${email}. Check your inbox!`;
          modalAlert.className = 'alert alert-success';
          modalAlert.style.display = 'block';

          setTimeout(() => {
            forgotModal.style.display = 'none';
            sendResetBtn.disabled = false;
            sendResetBtn.textContent = 'Send Reset Link';
            document.getElementById('resetEmail').value = '';
            modalAlert.style.display = 'none';
          }, 4000);

        } catch (err) {
          console.error('Password reset error:', err.message);
          modalAlert.textContent = err.message;
          modalAlert.className = 'alert alert-error';
          modalAlert.style.display = 'block';
          
          sendResetBtn.disabled = false;
          sendResetBtn.textContent = 'Send Reset Link';
        }
      });
    </script>
</body>
</html>
